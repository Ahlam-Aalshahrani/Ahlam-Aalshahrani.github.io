<style>
:root{--bg:#fff;--soft:#f2f7ff;--ink:#14223b;--mute:#53627c;--navy:#0b2a5b;--blue:#1d5fd1;--sky:#8db8ff;--line:#d6e2f5;--card:#fff;--on:#fff;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0a1427;--soft:#0f1d38;--ink:#e9f0ff;--mute:#a9b7d3;--navy:#cfe0ff;--blue:#6ea3ff;--sky:#2a4f96;--line:#23375f;--card:#101f3d;--on:#0a1427}}
:root[data-theme="dark"]{--bg:#0a1427;--soft:#0f1d38;--ink:#e9f0ff;--mute:#a9b7d3;--navy:#cfe0ff;--blue:#6ea3ff;--sky:#2a4f96;--line:#23375f;--card:#101f3d;--on:#0a1427}
html{scroll-padding-top:env(safe-area-inset-top,0px);scroll-behavior:smooth}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Readex Pro",system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif;line-height:1.8;font-weight:300}
.wrap{max-width:1000px;margin:0 auto;padding:0 20px}
header{border-bottom:1px solid var(--line)}
header .wrap{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;padding-top:14px;padding-bottom:14px;gap:8px 12px}
header b{font-weight:600;font-size:clamp(1.9rem,5.4vw,3rem);line-height:1.3;color:var(--navy)}
nav{display:flex;gap:18px;align-items:center;font-size:.92rem}
nav a{color:var(--mute);text-decoration:none}
nav a:hover{color:var(--blue)}
button{font:inherit;font-size:.9rem;cursor:pointer;border:1px solid var(--blue);background:transparent;color:var(--blue);border-radius:8px;padding:2px 14px}
a:focus-visible,button:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
.hero{background:var(--soft);border-bottom:1px solid var(--line)}
.hero .wrap{padding-top:52px;padding-bottom:52px;display:grid;gap:36px;grid-template-columns:1.25fr 1fr;align-items:center}
@media(max-width:760px){.hero .wrap{grid-template-columns:1fr}nav a{display:none}}
.hero h1{font-size:clamp(1.9rem,5.4vw,3rem);line-height:1.4;font-weight:600;color:var(--navy);margin:0 0 14px}
.hero p{color:var(--mute);margin:0 0 18px;max-width:34em}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 22px;padding:0;list-style:none}
.chips li{background:var(--card);border:1px solid var(--line);border-radius:999px;padding:0 14px;font-size:.88rem;color:var(--navy)}
.cta{display:inline-block;background:var(--blue);color:var(--on);text-decoration:none;border-radius:8px;padding:8px 22px;font-weight:600}
.stats{display:grid;gap:12px}
.stat{background:var(--card);border:1px solid var(--line);border-inline-start:5px solid var(--blue);border-radius:10px;padding:12px 18px}
.stat b{display:block;font-size:1.9rem;line-height:1.3;color:var(--blue);font-weight:600}
.stat span{color:var(--mute);font-size:.92rem}
section{padding:52px 0 8px}
h2{font-size:1.6rem;font-weight:600;color:var(--navy);margin:0 0 6px}
.lead{color:var(--mute);margin:0 0 26px}
.grid{display:grid;gap:20px;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr))}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.card svg{display:block;width:100%;height:auto;background:var(--soft)}
.card .in{padding:18px 20px 22px}
.tag{display:inline-block;background:var(--soft);color:var(--blue);border:1px solid var(--line);border-radius:6px;padding:0 10px;font-size:.82rem}
.card h3{margin:8px 0 2px;font-size:1.1rem;font-weight:600;color:var(--navy);line-height:1.6}
dl{margin:0}dt{font-weight:600;font-size:.88rem;margin-top:10px;color:var(--ink)}dd{margin:0;color:var(--mute);font-size:.95rem}
.two{display:grid;gap:20px;grid-template-columns:repeat(auto-fit,minmax(min(100%,420px),1fr))}
.box{background:var(--soft);border:1px solid var(--line);border-radius:12px;padding:22px}
.box h3{margin:0 0 8px;font-size:1.1rem;color:var(--navy);font-weight:600}
.box ul{margin:0;padding-inline-start:20px;color:var(--mute)}
.box li{margin:6px 0}
.contact{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(min(100%,220px),1fr))}
.contact a{display:block;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px 18px;text-decoration:none;color:var(--ink)}
.contact a:hover{border-color:var(--blue)}
.contact small{display:block;color:var(--blue);font-weight:600}
.contact span{direction:ltr;unicode-bidi:plaintext;display:block;overflow-wrap:anywhere;font-size:.92rem;color:var(--mute)}
footer{margin-top:52px;border-top:1px solid var(--line);padding:20px 0 36px;color:var(--mute);font-size:.88rem}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}}
</style>
</head>

<header><div class="wrap"><b id="brand"></b><nav><a href="#projects" id="n1"></a><a href="#experience" id="n2"></a><a href="#contact" id="n3"></a><button id="lang" type="button" aria-label="Language"></button></nav></div></header>
<main>
<div class="hero"><div class="wrap">
<div><h1 id="h1"></h1><p id="sub"></p><ul class="chips" id="chips"></ul><a class="cta" href="#contact" id="cta"></a></div>
